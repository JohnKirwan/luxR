name: Data provenance

on:
  push:
    paths:
      - "data/**"
      - "data-raw/**"
      - "inst/REFERENCES.bib"
      - ".github/workflows/data-provenance.yaml"
  pull_request:
    paths:
      - "data/**"
      - "data-raw/**"
      - "inst/REFERENCES.bib"
      - ".github/workflows/data-provenance.yaml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Verify bundled data provenance and deterministic rebuilds
        run: Rscript --vanilla data-raw/verify_bundled_data.R
