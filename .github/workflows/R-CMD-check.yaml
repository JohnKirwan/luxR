on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}
          # The four previous R versions; DESCRIPTION's minimum R matches the
          # oldest of these, so the stated requirement is the tested one.
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest, r: 'oldrel-2'}
          - {os: ubuntu-latest, r: 'oldrel-3'}
          - {os: ubuntu-latest, r: 'oldrel-4'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # CRAN also checks with suggested packages unavailable. Install only hard
  # dependencies plus the check, test and vignette tooling, confirm the optional
  # packages are absent, and require examples, tests and vignettes to skip them.
  no-suggests:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, no Suggests)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown
          needs: check
      - name: Confirm optional packages are absent
        run: |
          optional <- c("pavo", "colourvision", "photobiology", "lightr", "shiny")
          present <- optional[vapply(optional, requireNamespace, logical(1),
                                     quietly = TRUE)]
          if (length(present)) {
            stop("Suggested packages installed in the no-Suggests job: ",
                 paste(present, collapse = ", "))
          }
        shell: Rscript {0}
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # Full CRAN submission check: incoming checks (DESCRIPTION, URLs, spelling,
  # size) and the PDF manual, which the matrix above skips. A green job can
  # still carry NOTEs (it fails on warnings only): read the log.
  cran-incoming:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_CRAN_INCOMING_: true
      _R_CHECK_CRAN_INCOMING_REMOTE_: true
      _R_CHECK_CRAN_INCOMING_USE_ASPELL_: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install HTML Tidy and aspell (manual validation, spelling)
        run: sudo apt-get update && sudo apt-get install -y tidy aspell aspell-en
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::V8
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          build_args: 'c("--compact-vignettes=gs+qpdf")'

  conditions-guard:
    runs-on: ubuntu-latest
    name: typed errors only
    steps:
      - uses: actions/checkout@v4
      - name: No untyped stop() or stopifnot() in R/
        # Errors go through .luxr_abort(); only rethrows (stop(e)) and the
        # constructors in R/conditions.R may call stop() directly.
        run: |
          if grep -rnE '\bstop\(|stopifnot\(' R/ \
               | grep -vE '^R/conditions\.R:|stop\(e\)'; then
            echo "Use .luxr_abort() instead of stop()/stopifnot()."
            exit 1
          fi
