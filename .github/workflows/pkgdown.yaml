# Build the pkgdown documentation site and deploy it to GitHub Pages (gh-pages).
#
# The deployment cleans obsolete pkgdown output while preserving the shinylive
# app that shinylive.yaml publishes under /app on the same gh-pages branch.
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pkgdown-pr-{0}', github.run_id) || 'pages' }}
      cancel-in-progress: false
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Validate pkgdown configuration
        run: pkgdown::check_pkgdown(".")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = TRUE, install = TRUE)
        shell: Rscript {0}

      - name: Validate generated documentation surface
        run: Rscript .github/scripts/check-pkgdown-site.R

      - name: Deploy to GitHub Pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: true
          clean-exclude: app
          branch: gh-pages
          folder: docs
