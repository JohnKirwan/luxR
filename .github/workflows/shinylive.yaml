# Build the bundled Shiny app (inst/app) as a static shinylive site and deploy
# it to GitHub Pages under /app, alongside the pkgdown documentation.
#
# WebAssembly binaries come from r-universe.
#
# luxR is installed from https://johnkirwan.r-universe.dev, which builds and
# serves a WASM binary of the GitHub master branch. Installing from that repo
# records it in luxR's installed DESCRIPTION, and `shinylive::export()` then
# downloads luxR's WASM binary from r-universe automatically (shinylive >= 0.8.0).
#
# Runs on a published release, or manually via "Run workflow" with a release TAG
# selected as the ref. The app code comes from the tag but the luxR binary comes
# from r-universe (master HEAD), so the run fails unless the tag, the checked-out
# DESCRIPTION and the r-universe build all carry the same version. Publish the
# release only after r-universe has built that version, and keep master at the
# release commit until this workflow has deployed.
on:
  release:
    types: [published]
  workflow_dispatch:

name: shinylive.yaml

jobs:
  # Export the app as a static shinylive site and deploy it to gh-pages /app.
  deploy-app:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install shinylive, and luxR FROM r-universe so its installed DESCRIPTION
      # records the r-universe repository. shinylive::export then resolves luxR's
      # WASM binary from r-universe automatically.
      - name: Install shinylive and luxR (luxR from r-universe)
        run: |
          install.packages("shinylive")
          install.packages(
            "luxR",
            repos = c(
              "https://johnkirwan.r-universe.dev",
              "https://cloud.r-project.org"
            )
          )
        shell: Rscript {0}

      - name: Check the r-universe luxR build matches the release tag
        run: |
          tag <- sub("^v", "", Sys.getenv("GITHUB_REF_NAME"))
          source_version <- unname(read.dcf("DESCRIPTION", fields = "Version")[1, 1])
          built_version <- as.character(utils::packageVersion("luxR"))
          if (!identical(tag, source_version) || !identical(tag, built_version)) {
            stop(sprintf(paste(
              "Version mismatch: ref '%s', checked-out DESCRIPTION %s,",
              "r-universe build %s. Run this workflow from a release tag, after",
              "r-universe has built that version and before master moves on."
            ), Sys.getenv("GITHUB_REF_NAME"), source_version, built_version))
          }
          message("luxR ", built_version, " matches release ", Sys.getenv("GITHUB_REF_NAME"))
        shell: Rscript {0}

      - name: Export the app as a static shinylive site
        run: shinylive::export(appdir = "inst/app", destdir = "_site/app")
        shell: Rscript {0}

      - name: Deploy to gh-pages /app (preserving pkgdown content)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site/app
          target-folder: app
          clean: true
