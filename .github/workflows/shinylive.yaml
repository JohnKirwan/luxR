# Build the bundled Shiny app (inst/app) as a static shinylive site and deploy
# it to GitHub Pages under /app, alongside the pkgdown documentation.
#
# WebAssembly binaries come from r-universe.
#
# shinylive needs a WebAssembly build of luxR, which is not on CRAN's WASM mirror
# (repo.r-wasm.org). luxR is published on https://johnkirwan.r-universe.dev, which
# builds and serves a WASM binary for every registered package. Installing luxR
# from that repo records the r-universe repository in luxR's installed DESCRIPTION,
# and `shinylive::export()` then downloads luxR's WASM binary from r-universe
# automatically (shinylive >= 0.8.0). No per-release image build is required.
#
# Runs on a published release; to refresh the hosted app, publish (or re-publish)
# a GitHub Release. NOTE: make sure r-universe has finished (re)building the
# current luxR before publishing, so the exported app picks up a matching WASM
# binary.
on:
  release:
    types: [published]

name: shinylive.yaml

jobs:
  # Export the app as a static shinylive site and deploy it to gh-pages /app.
  deploy-app:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install shinylive, and luxR FROM r-universe so its installed DESCRIPTION
      # records the r-universe repository. shinylive::export then resolves luxR's
      # WASM binary from r-universe automatically.
      - name: Install shinylive and luxR (luxR from r-universe)
        run: |
          install.packages("shinylive")
          install.packages(
            "luxR",
            repos = c(
              "https://johnkirwan.r-universe.dev",
              "https://cloud.r-project.org"
            )
          )
        shell: Rscript {0}

      - name: Export the app as a static shinylive site
        run: shinylive::export(appdir = "inst/app", destdir = "_site/app")
        shell: Rscript {0}

      - name: Deploy to gh-pages /app (preserving pkgdown content)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site/app
          target-folder: app
          clean: true
