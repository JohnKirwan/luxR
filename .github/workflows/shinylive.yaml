# Build the bundled Shiny app (inst/app) as a static shinylive site and deploy
# it to GitHub Pages under /app, alongside the pkgdown documentation.
#
# Why this is release-driven, not push-driven:
#
# shinylive resolves the WebAssembly binary for a package from that package's
# *installed* DESCRIPTION metadata. For a package installed from GitHub it
# downloads a `library.data` / `library.js.metadata` filesystem image attached
# to the GitHub Release whose tag matches the install ref. luxR is not on CRAN's
# WASM mirror (repo.r-wasm.org), so it must ship its own image.
#
# So this workflow runs only on a published release, in two jobs:
#   1. `wasm-assets` builds luxR into a webR filesystem image inside the official
#      webR/Emscripten container and attaches it to the release.
#   2. `deploy-app` installs luxR from the release tag — so its DESCRIPTION
#      carries the GitHub remote metadata shinylive needs — exports the app
#      (shinylive auto-downloads the image from step 1), and publishes it.
#
# To refresh the hosted app, publish (or re-publish) a GitHub Release.
#
# FUTURE (r-universe): once luxR is published on johnkirwan.r-universe.dev, the
# `wasm-assets` job can be removed and the `deploy-app` install step changed to
# install luxR from the r-universe repo (which serves the wasm binary itself).
# Everything else — the app, the pkgdown site, the navbar link, the URL — is
# unchanged. See also DESCRIPTION's `Repository:` field for that switch.
on:
  release:
    types: [published]

name: shinylive.yaml

jobs:
  # Build luxR's WebAssembly filesystem image and attach it to the release.
  wasm-assets:
    runs-on: ubuntu-latest
    permissions:
      # For attaching the image to the release.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build luxR WebAssembly filesystem image
        run: |
          docker run --rm \
            -e GITHUB_PAT="${{ secrets.GITHUB_TOKEN }}" \
            -v "$(pwd):/github/workspace" \
            --workdir /github/workspace \
            ghcr.io/r-wasm/webr:main \
            Rscript -e 'rwasm::add_pkg(".", repo_dir = "_repo"); rwasm::make_vfs_library(out_dir = "_image", repo_dir = "_repo", compress = FALSE)'

      - name: Upload the image to the release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "_image/*"
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true

  # Export the app as a static shinylive site and deploy it to gh-pages /app.
  deploy-app:
    needs: wasm-assets
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # Needed for shinylive to query the GitHub release assets API.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install shinylive plus luxR FROM the release tag. Installing from GitHub
      # (not local source) gives luxR the RemoteType/RemoteRef DESCRIPTION fields
      # that shinylive uses to locate the release's WASM image; the ref must
      # match the release tag built in `wasm-assets`.
      - name: Install shinylive and luxR (from the release tag)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            github::JohnKirwan/luxR@${{ github.event.release.tag_name }}

      - name: Export the app as a static shinylive site
        run: shinylive::export(appdir = "inst/app", destdir = "_site/app")
        shell: Rscript {0}

      - name: Deploy to gh-pages /app (preserving pkgdown content)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site/app
          target-folder: app
          clean: true
