url: https://johnkirwan.github.io/luxR/

template:
  bootstrap: 5

navbar:
  structure:
    right: [app, search, github]
  components:
    app:
      text: "Live app"
      href: app/index.html

home:
  title: "luxR — Underwater Light Analysis"
  description: >
    Convert between photometric and radiometric units, propagate spectral
    irradiance through the water column, and model photoreceptor quantum catch
    and colour discrimination.

articles:
  - title: "Guides"
    contents:
      - light-in-water
      - visual-ecology
      - seeing-through-water
      - polarization

news:
  cran_dates: false

reference:
  - title: "Package & app"
    desc: "Package overview and the interactive Shiny explorer."
    contents:
      - luxR-package
      - run_app

  - title: "Unit conversions"
    desc: "Convert between radiometric and photometric quantities."
    contents:
      - photon2W
      - W2photon
      - n2W_spec_irradiance
      - W2mol_spec_irradiance
      - reflectance_to_radiance
      - wavelength_in_medium
      - ft2m
      - m2ft

  - title: "Photometric quantities"
    desc: "Compute illuminance and PAR from spectral irradiance."
    contents:
      - irradiance2lux
      - scotopic_lux
      - lux2irradiance
      - broadband2spectrum
      - par_irradiance
      - par_fraction
      - unit_label
      - unit_expression

  - title: "Spectral data sources"
    desc: "Accessors for bundled reference spectra and field data import.
      lux_spectrum-returning wrappers (from_naples, from_solar, from_trios,
      from_ocean_optics) are listed under Spectral abstraction."
    contents:
      - solar_irradiance
      - read_trios
      - read_ocean_optics
      - read_instrument_spectrum
      - read_spectrum

  - title: "Depth propagation"
    desc: "Beer-Lambert attenuation through the water column."
    contents:
      - attenuate_spectrum
      - attenuate_depth
      - propagate_depth
      - propagate_spectrum
      - band_irradiance
      - photic_depth
      - fit_Kd
      - jerlov_Kd
      - light_at_depth

  - title: "Optical visibility"
    desc: "Secchi depth, diver/camera visual range, image contrast, and
      object-vs-background detection."
    contents:
      - secchi_depth
      - visual_range
      - michelson_contrast
      - weber_contrast
      - inherent_contrast
      - contrast_at_distance
      - detection_range
      - detectability

  - title: "Inherent optical properties & interface"
    desc: "Beam attenuation, Beer-Lambert transmittance/absorbance, and the
      air-water boundary."
    contents:
      - beam_attenuation
      - single_scattering_albedo
      - transmittance
      - absorbance
      - snells_window
      - fresnel_reflectance
      - surface_transmittance

  - title: "Polarization"
    desc: "Linear polarization of the underwater light field (single-scattering
      model) and Stokes-parameter descriptors."
    contents:
      - underwater_polarization
      - polarization_contrast
      - degree_of_polarization
      - angle_of_polarization
      - scattering_angle
      - refracted_solar_angle

  - title: "Species perception"
    desc: "Visual pigment templates, quantum catch, and colour discrimination."
    contents:
      - govardovskii_template
      - receptor_absorptance
      - fit_sensitivity
      - species_LEF
      - quantum_catch
      - species_brightness
      - colour_jnd
      - species_sensitivity_matrix

  - title: "Geometry"
    desc: "Radiance/irradiance conversion with solid-angle geometry."
    contents:
      - irradiance2radiance
      - radiance2irradiance

  - title: "Datasets"
    desc: "Reference data bundled with the package."
    contents:
      - CIE1931
      - CIE_scotopic
      - Naples
      - jerlov_types
      - solar_spectra
      - species_sensitivities
      - species_channels
      - species_channel_support

  - title: "Spectral abstraction"
    desc: "lux_spectrum S3 class, coercers, format readers, and unit conversion."
    contents:
      - lux_spectrum
      - as_lux_spectrum
      - as_rspec
      - as_colourvision
      - as_source_spct
      - as_reflector_spct
      - convert_unit
      - resample_spectrum
      - plot_spectra
      - from_naples
      - from_solar
      - from_trios
      - from_ocean_optics
